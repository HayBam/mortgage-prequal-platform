# Pull request checks for the app and its Kubernetes manifests.
# Nothing is pushed or deployed here. It only answers: "Is this change safe
# to merge?"
name: app-ci

on:
  pull_request:
    branches: [main]
    paths: ["app/**", "deploy/**", ".github/workflows/app-ci.yml", ".github/workflows/release.yml"]

permissions:
  contents: read

env:
  CHECKOV_VERSION: 3.4.6
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.1

jobs:
  test:
    name: Unit and API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  image-scan:
    name: Build image and scan for vulnerabilities
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build --build-arg APP_VERSION=pr-check -t mortgage-prequal:ci app
      - name: Trivy scan (fail on HIGH or CRITICAL vulnerabilities that have a fix)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress mortgage-prequal:ci

  manifests:
    name: Kubernetes manifests and Dockerfile policy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install --quiet "checkov==${CHECKOV_VERSION}"
      - name: Render manifests exactly as Argo CD will (kustomize build)
        run: kubectl kustomize deploy/mortgage-prequal > rendered.yaml
      - name: Checkov - Kubernetes (non-root, read-only FS, limits, probes, digest-pinned image...)
        run: checkov -f rendered.yaml --framework kubernetes --quiet --compact
      - name: Checkov - Dockerfile
        run: checkov -f app/Dockerfile --framework dockerfile --quiet --compact
