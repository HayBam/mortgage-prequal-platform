# Alert rules, version-controlled with the app. Each alert points to a section
# of docs/runbook.md, so whoever is on call knows exactly what to do.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mortgage-prequal
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: mortgage-prequal
      rules:
        # Reliability: more than 5% of requests failing with 5xx errors.
        - alert: PrequalHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="mortgage-prequal",status=~"5.."}[5m]))
              / sum(rate(http_requests_total{namespace="mortgage-prequal"}[5m])) > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Broker API error rate above 5%"
            runbook: "docs/runbook.md#prequalhigherrorrate"

        # Performance: 95th-percentile latency above 500 ms.
        - alert: PrequalHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{namespace="mortgage-prequal",path="/v1/prequalify"}[5m]))
            ) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Broker API p95 latency above 500ms"
            runbook: "docs/runbook.md#prequalhighlatency"

        # Security: a burst of requests with a wrong or missing API key. Could
        # be a broker with a stale key after rotation, or credential stuffing.
        - alert: PrequalUnauthorizedSpike
          expr: sum(rate(prequal_decisions_total{namespace="mortgage-prequal",outcome="unauthorized"}[2m])) > 0.2
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Spike in rejected API keys on the broker API"
            runbook: "docs/runbook.md#prequalunauthorizedspike"

        # Availability: fewer than 2 pods ready.
        - alert: PrequalReplicasUnavailable
          expr: kube_deployment_status_replicas_available{namespace="mortgage-prequal",deployment="mortgage-prequal"} < 2
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Broker API has fewer than 2 ready pods"
            runbook: "docs/runbook.md#prequalreplicasunavailable"
