apiVersion: apps/v1
kind: Deployment
metadata:
  name: mortgage-prequal
  labels:
    app.kubernetes.io/name: mortgage-prequal
spec:
  replicas: 2 # two pods, spread over two nodes, so one node failure is not an outage
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: mortgage-prequal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below 2 ready pods during a release
      maxSurge: 1       # start one new pod, wait until it is ready, then remove an old one
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mortgage-prequal
        azure.workload.identity/use: "true" # opt this pod in to workload identity
    spec:
      serviceAccountName: mortgage-prequal
      automountServiceAccountToken: false # the app never calls the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mortgage-prequal
      containers:
        - name: api
          # Kustomize replaces this with <acr>.azurecr.io/mortgage-prequal@sha256:<digest>
          # (see kustomization.yaml). A digest is immutable: what was scanned is
          # exactly what runs.
          image: mortgage-prequal
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: mortgage-prequal-config
          env:
            - name: BROKER_API_KEY_FILE
              value: /mnt/secrets-store/broker-api-key
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Liveness: is the process alive? If not, restart it.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness: can it serve brokers (is the API key loaded)? If not, take
          # it out of the Service until it is.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: broker-api-key
              mountPath: /mnt/secrets-store
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: broker-api-key
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: broker-api-key
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
