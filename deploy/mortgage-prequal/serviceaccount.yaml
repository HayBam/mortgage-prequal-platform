# The identity the app's pods run as. The annotation links it to the Azure
# managed identity (id-prequal-demo-app) via the federated credential that
# Terraform created. scripts/set-manifest-values.sh fills in the client ID.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mortgage-prequal
  annotations:
    azure.workload.identity/client-id: "1c7e5cf4-d0a7-4a40-a388-096e0fb7e4a7"
automountServiceAccountToken: false
