# Tells the Secrets Store CSI driver WHICH Key Vault secret to mount and WHICH
# identity to use. The secret value never appears in Git or in a Kubernetes
# Secret object. It is mounted as a read-only file at
# /mnt/secrets-store/broker-api-key.
# These IDs are not secrets. scripts/set-manifest-values.sh fills them in.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: broker-api-key
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "REPLACE_APP_IDENTITY_CLIENT_ID"
    keyvaultName: "REPLACE_KEY_VAULT_NAME"
    tenantId: "REPLACE_TENANT_ID"
    objects: |
      array:
        - |
          objectName: broker-api-key
          objectType: secret
